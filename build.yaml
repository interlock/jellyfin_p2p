overview: "Share libraries between Jellyfin servers with invite tokens"
description: >
  P2P Share lets a Jellyfin server operator share selected libraries with another
  Jellyfin server running the same plugin. Each share is an invite token with its own
  library selection, transcoding permission, bitrate cap, bandwidth limit and data quota.
  Shared libraries appear as regular libraries on the receiving server.
