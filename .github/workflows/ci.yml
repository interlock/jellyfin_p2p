name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.P2PShare.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.P2PShare.sln -c Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.P2PShare.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Package plugin
        run: |
          mkdir -p artifacts
          cp src/Jellyfin.Plugin.P2PShare/bin/Release/net9.0/Jellyfin.Plugin.P2PShare.dll artifacts/
          cp build.yaml artifacts/
          (cd artifacts && zip -q ../p2pshare.zip *)

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-p2pshare
          path: p2pshare.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
