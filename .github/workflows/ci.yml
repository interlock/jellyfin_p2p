name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test release tooling
        run: |
          pip install pyyaml
          python -m unittest discover -s scripts -v

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.P2PShare.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.P2PShare.sln -c Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.P2PShare.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Package plugin
        run: >
          python scripts/release.py package --version 0.0.0.${{ github.run_number }}
          --changelog "CI build ${{ github.sha }}"
          --dll-dir src/Jellyfin.Plugin.P2PShare/bin/Release/net10.0 --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-p2pshare
          path: dist/*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
